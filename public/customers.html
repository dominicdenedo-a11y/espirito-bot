<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espirito — Customers</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-header">
    <span class="brand">ESPIRITO</span>
    <button class="menu-btn" id="menu-toggle">☰</button>
  </div>
  <div class="menu-overlay" id="menu-overlay">
    <div class="menu-panel">
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="deals.html">Deals</a>
      <a href="history.html">Order History</a>
      <a href="customers.html" class="active">Customers</a>
      <a href="settings.html">Settings</a>
      <a href="#" class="logout" id="logout-link">Log Out</a>
    </div>
  </div>

  <div class="page">
    <h1>Customers</h1>
    <div id="customers-list"><p class="empty">Loading...</p></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://sbtmbkpgefzgcokucitm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_0AbGRZ4qXZFC6GwcllNmrg_CvnW84Ka';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    client.auth.getSession().then(({ data }) => {
      if (!data.session) window.location.href = 'login.html';
    });

    document.getElementById('menu-toggle').addEventListener('click', () => {
      document.getElementById('menu-overlay').classList.add('open');
    });
    document.getElementById('menu-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'menu-overlay') e.target.classList.remove('open');
    });
    document.getElementById('logout-link').addEventListener('click', async (e) => {
      e.preventDefault();
      await client.auth.signOut();
      window.location.href = 'login.html';
    });

    async function loadCustomers() {
      const container = document.getElementById('customers-list');
      const { data: deals, error } = await client
        .from('deals')
        .select('*, products(name, price)')
        .eq('status', 'confirmed')
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = '<p class="error">Error: ' + error.message + '</p>';
        return;
      }
      if (!deals || deals.length === 0) {
        container.innerHTML = '<p class="empty">No confirmed orders yet.</p>';
        return;
      }

      const byCustomer = {};
      for (const deal of deals) {
        const key = deal.customer_number;
        if (!byCustomer[key]) {
          byCustomer[key] = { items: [], total: 0 };
        }
        const price = deal.products ? Number(deal.products.price) : 0;
        byCustomer[key].items.push(deal.products ? deal.products.name : 'Unknown item');
        byCustomer[key].total += price;
      }

      container.innerHTML = Object.entries(byCustomer).map(([customer, info]) => `
        <div class="card">
          <p><strong>${customer}</strong></p>
          <p>Bought: ${info.items.join(', ')}</p>
          <p>Total spent: ₦${info.total.toLocaleString()}</p>
        </div>
      `).join('');
    }

    loadCustomers();
  </script>
</body>
</html>
