<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espirito — Deals</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-header">
    <span class="brand">ESPIRITO</span>
    <button class="menu-btn" id="menu-toggle">☰</button>
  </div>
  <div class="menu-overlay" id="menu-overlay">
    <div class="menu-panel">
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="deals.html" class="active">Deals</a>
      <a href="history.html">Order History</a>
      <a href="customers.html">Customers</a>
      <a href="analytics.html">Analytics</a>
      <a href="settings.html">Settings</a>
      <a href="#" class="logout" id="logout-link">Log Out</a>
    </div>
  </div>

  <div class="page">
    <h1>Pending Deals</h1>
    <div id="deals-list"><p class="empty">Loading...</p></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://sbtmbkpgefzgcokucitm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_0AbGRZ4qXZFC6GwcllNmrg_CvnW84Ka';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    client.auth.getSession().then(({ data }) => {
      if (!data.session) window.location.href = 'login.html';
    });

    document.getElementById('menu-toggle').addEventListener('click', () => {
      document.getElementById('menu-overlay').classList.add('open');
    });
    document.getElementById('menu-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'menu-overlay') e.target.classList.remove('open');
    });
    document.getElementById('logout-link').addEventListener('click', async (e) => {
      e.preventDefault();
      await client.auth.signOut();
      window.location.href = 'login.html';
    });

    async function loadDeals() {
      const container = document.getElementById('deals-list');
      const { data: deals, error } = await client
        .from('deals')
        .select('*, products(name, price)')
        .eq('status', 'pending')
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = '<p class="error">Error: ' + error.message + '</p>';
        return;
      }
      if (!deals || deals.length === 0) {
        container.innerHTML = '<p class="empty">No pending deals right now.</p>';
        return;
      }

      container.innerHTML = deals.map(deal => `
        <div class="card" id="deal-${deal.id}">
          <span class="status">${deal.status}</span>
          <p><strong>Product:</strong> ${deal.products ? deal.products.name + ' — ₦' + deal.products.price : 'N/A'}</p>
          <p><strong>Customer:</strong> ${deal.customer_number}</p>
          <div class="view-msg" data-id="${deal.id}">
            <p><strong>Message:</strong> "${deal.chat_summary}"</p>
            <button onclick="toggleDealEdit('${deal.id}')">Edit Message</button>
          </div>
          <div class="edit-msg" data-id="${deal.id}" style="display:none;">
            <input type="text" id="edit-summary-${deal.id}" value="${(deal.chat_summary || '').replace(/"/g, '&quot;')}">
            <button onclick="saveDealEdit('${deal.id}')">Save</button>
            <button onclick="toggleDealEdit('${deal.id}')">Cancel</button>
          </div>
          <div class="buttons">
            <button class="confirm" onclick="updateDeal('${deal.id}', 'confirmed', '${deal.product_id || ''}')">Confirm</button>
            <button class="reject" onclick="updateDeal('${deal.id}', 'rejected', '')">Reject</button>
            <button class="reject" onclick="deleteDeal('${deal.id}')">Delete</button>
          </div>
        </div>
      `).join('');

      window._loadDeals = loadDeals;
    }

    function toggleDealEdit(id) {
      document.querySelectorAll('.view-msg[data-id="' + id + '"]').forEach(el => {
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
      });
      document.querySelectorAll('.edit-msg[data-id="' + id + '"]').forEach(el => {
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
      });
    }

    async function saveDealEdit(id) {
      const chat_summary = document.getElementById('edit-summary-' + id).value;
      const { error } = await client.from('deals').update({ chat_summary }).eq('id', id);
      if (error) {
        alert('Error saving: ' + error.message);
        return;
      }
      loadDeals();
    }

    async function updateDeal(id, status, productId) {
      const { error } = await client.from('deals').update({ status }).eq('id', id);
      if (error) {
        alert('Error updating deal: ' + error.message);
        return;
      }

      if (status === 'confirmed' && productId) {
        const { data: product } = await client
          .from('products')
          .select('stock')
          .eq('id', productId)
          .single();

        if (product && product.stock > 0) {
          await client
            .from('products')
            .update({ stock: product.stock - 1 })
            .eq('id', productId);
        }
      }

      loadDeals();
    }

    async function deleteDeal(id) {
      if (!confirm('Delete this deal?')) return;
      const { error } = await client.from('deals').delete().eq('id', id);
      if (error) {
        alert('Error deleting deal: ' + error.message);
        return;
      }
      loadDeals();
    }

    loadDeals();
  </script>
</body>
</html>
